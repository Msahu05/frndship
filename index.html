<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Happy Friendship Day</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --rose-deep: #9b1b4a;
      --rose: #c9184a;
      --blush: #ff758f;
      --petal: #ffe0e6;
      --cream-soft: #fff5f7;
      --ink: #3d1528;
      --ink-soft: #5c2a3d;
      --yes: #c9184a;
      --no: #6b3a4a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100%;
      height: 100%;
    }

    body {
      font-family: "Outfit", sans-serif;
      color: var(--ink);
      overflow-x: hidden;
      background:
        radial-gradient(ellipse 120% 80% at 10% 0%, #ffb3c1 0%, transparent 55%),
        radial-gradient(ellipse 100% 70% at 90% 10%, #ff8fab 0%, transparent 50%),
        radial-gradient(ellipse 80% 60% at 50% 100%, #ffc2d1 0%, transparent 55%),
        linear-gradient(165deg, #fff0f3 0%, #ffe4ec 40%, #ffd6e0 100%);
      position: relative;
    }

    .hearts-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .floating-heart {
      position: absolute;
      bottom: -40px;
      color: var(--rose);
      opacity: 0.18;
      animation: float-up linear infinite;
      font-size: 1.2rem;
      user-select: none;
    }

    @keyframes float-up {
      0% {
        transform: translateY(0) rotate(0deg) scale(1);
        opacity: 0;
      }
      10% { opacity: 0.22; }
      90% { opacity: 0.12; }
      100% {
        transform: translateY(-110vh) rotate(25deg) scale(1.15);
        opacity: 0;
      }
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem 3rem;
    }

    .stage {
      width: min(680px, 100%);
      text-align: center;
    }

    .title {
      font-family: "Great Vibes", cursive;
      font-size: clamp(2.8rem, 10vw, 5.2rem);
      line-height: 1.15;
      color: var(--rose-deep);
      margin-bottom: 1.5rem;
      letter-spacing: 0.02em;
      animation: title-in 1s ease-out both;
    }

    @keyframes title-in {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .message-wrap {
      position: relative;
      text-align: left;
      max-height: min(52vh, 420px);
      overflow-y: auto;
      padding: 0.25rem 0.5rem 0.25rem 0;
      margin-bottom: 1.75rem;
      scrollbar-width: thin;
      scrollbar-color: var(--blush) transparent;
    }

    .message-wrap::-webkit-scrollbar {
      width: 4px;
    }

    .message-wrap::-webkit-scrollbar-thumb {
      background: var(--blush);
      border-radius: 4px;
    }

    .message {
      font-size: clamp(0.95rem, 2.5vw, 1.08rem);
      line-height: 1.75;
      font-weight: 300;
      color: var(--ink-soft);
      white-space: pre-wrap;
    }

    .cursor {
      display: inline-block;
      width: 2px;
      height: 1.1em;
      background: var(--rose);
      margin-left: 2px;
      vertical-align: text-bottom;
      animation: blink 0.75s step-end infinite;
    }

    .cursor.hidden {
      display: none;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    .btn {
      appearance: none;
      border: none;
      font-family: "Outfit", sans-serif;
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      cursor: pointer;
      padding: 0.85rem 2.2rem;
      transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .btn-continue,
    .btn-yes {
      background: var(--yes);
      color: #fff;
      border-radius: 999px;
      box-shadow: 0 8px 24px rgba(201, 24, 74, 0.28);
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px);
    }

    .btn-continue.visible,
    .btn-yes.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
      animation: btn-pop 0.45s ease both;
    }

    .btn-continue:hover,
    .btn-yes:hover {
      transform: translateY(-2px) scale(1.03);
      background: var(--rose-deep);
    }

    .btn-continue:active,
    .btn-yes:active {
      transform: scale(0.98);
    }

    @keyframes btn-pop {
      from {
        opacity: 0;
        transform: translateY(12px) scale(0.94);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Screen 2 & 3 */
    .screen {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
      animation: fade-in 0.55s ease both;
    }

    .screen.active {
      display: flex;
    }

    @keyframes fade-in {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .question {
      font-family: "Great Vibes", cursive;
      font-size: clamp(2.2rem, 8vw, 3.6rem);
      color: var(--rose-deep);
      line-height: 1.2;
      margin-bottom: 2.5rem;
      max-width: 16ch;
    }

    .choices {
      position: relative;
      width: min(360px, 90vw);
      height: 180px;
      margin: 0 auto;
    }

    .btn-yes {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      opacity: 1;
      pointer-events: auto;
      min-width: 110px;
      z-index: 1;
    }

    .btn-yes:hover {
      transform: translate(-50%, calc(-50% - 2px)) scale(1.03);
    }

    .btn-no {
      position: absolute;
      left: 70%;
      top: 72%;
      transform: translate(-50%, -50%);
      background: transparent;
      color: var(--no);
      border: 1.5px solid rgba(107, 58, 74, 0.35);
      border-radius: 999px;
      padding: 0.75rem 1.6rem;
      min-width: 96px;
      z-index: 2;
      transition: left 0.12s ease, top 0.12s ease;
      user-select: none;
    }

    .btn-no:hover {
      background: rgba(255, 255, 255, 0.35);
    }

    .final-msg {
      font-size: clamp(1.15rem, 4vw, 1.45rem);
      line-height: 1.65;
      font-weight: 400;
      color: var(--ink);
      max-width: 22ch;
      margin: 0 auto;
    }

    .final-heart {
      display: block;
      font-size: 3rem;
      margin-top: 1.5rem;
      animation: pulse-heart 1.2s ease-in-out infinite;
    }

    @keyframes pulse-heart {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }

    .decor-heart {
      position: absolute;
      width: 18px;
      height: 18px;
      opacity: 0.35;
      pointer-events: none;
    }

    .decor-heart::before,
    .decor-heart::after {
      content: "";
      position: absolute;
      width: 10px;
      height: 16px;
      background: var(--rose);
      border-radius: 10px 10px 0 0;
    }

    .decor-heart::before {
      left: 9px;
      transform: rotate(-45deg);
      transform-origin: 0 100%;
    }

    .decor-heart::after {
      left: 0;
      transform: rotate(45deg);
      transform-origin: 100% 100%;
    }

    #screen-letter .title {
      margin-bottom: 1.25rem;
    }

    @media (max-width: 480px) {
      .page {
        padding: 1.5rem 1rem 2.5rem;
        justify-content: flex-start;
        padding-top: 12vh;
      }

      .message-wrap {
        max-height: 48vh;
      }

      .choices {
        height: 220px;
        width: 92vw;
      }
    }
  </style>
</head>
<body>
  <div class="hearts-bg" id="heartsBg" aria-hidden="true"></div>

  <main class="page">
    <!-- Screen 1: Letter -->
    <section class="stage screen active" id="screen-letter">
      <h1 class="title">Happy friendship day</h1>
      <div class="message-wrap" id="messageWrap">
        <p class="message" id="message"></p><span class="cursor" id="cursor"></span>
      </div>
      <button type="button" class="btn btn-continue" id="btnContinue">Continue</button>
    </section>

    <!-- Screen 2: Date question -->
    <section class="stage screen" id="screen-date">
      <h2 class="question">Are we going on date asap?</h2>
      <div class="choices" id="choices">
        <button type="button" class="btn btn-yes" id="btnYes">Yes</button>
        <button type="button" class="btn btn-no" id="btnNo">No</button>
      </div>
    </section>

    <!-- Screen 3: Final -->
    <section class="stage screen" id="screen-final">
      <p class="final-msg" id="finalMsg"></p>
      <span class="final-heart" aria-hidden="true">♥</span>
    </section>
  </main>

  <script>
    const LETTER = `I don't think I'll ever be able to put into words how much you truly mean to me, but I'll still try. Thank you for being the kind of person who never lets me feel alone. You've done so much for me that sometimes I genuinely wonder what I did to deserve a friend like you. From taking care of my expenses without making me feel guilty, to never saying no whenever I needed something, you've always stood beside me without expecting anything in return. People often stay when life is easy, but you are different. Maybe you aren't there for every happy moment, but whenever life gets hard, whenever I break down, whenever things don't go my way, you're always the first person standing beside me. That kind of support is rare, and I'll never take it for granted.
I don't know what the future holds, but I do know one thing: no matter where life takes us, I'll always be grateful that I got a best friend like you. Money can be earned again, favors can be returned, but genuine care, loyalty, and a heart as pure as yours are impossible to replace. Thank you for never giving up on me, for being my safe place during the worst days of my life, for always reminding me that I'm not fighting alone. I sincerely pray that life gives you back every bit of happiness you've selflessly given to others, especially to me. You deserve the kind of love, respect, success, and peace that you've always wished for everyone else. Thank you for everything you've done, everything you still do, and everything you'll probably keep doing without ever asking for credit. You'll always have a very special place in my heart, and no matter how many people come and go in my life, you'll always be one of the few I'll forever be thankful for. ❤️`;

    const FINAL = "I know, you won't say no, get free asap and take me to the date..";

    const messageEl = document.getElementById("message");
    const cursorEl = document.getElementById("cursor");
    const messageWrap = document.getElementById("messageWrap");
    const btnContinue = document.getElementById("btnContinue");
    const btnYes = document.getElementById("btnYes");
    const btnNo = document.getElementById("btnNo");
    const choices = document.getElementById("choices");
    const screenLetter = document.getElementById("screen-letter");
    const screenDate = document.getElementById("screen-date");
    const screenFinal = document.getElementById("screen-final");
    const finalMsg = document.getElementById("finalMsg");

    function spawnHearts() {
      const bg = document.getElementById("heartsBg");
      const count = window.innerWidth < 480 ? 14 : 22;
      for (let i = 0; i < count; i++) {
        const h = document.createElement("span");
        h.className = "floating-heart";
        h.textContent = "♥";
        h.style.left = Math.random() * 100 + "%";
        h.style.fontSize = 0.8 + Math.random() * 1.6 + "rem";
        h.style.animationDuration = 8 + Math.random() * 12 + "s";
        h.style.animationDelay = Math.random() * 10 + "s";
        h.style.color = ["#c9184a", "#ff758f", "#e5386d", "#ff8fab"][i % 4];
        bg.appendChild(h);
      }
    }

    function typeWriter(text, el, speed = 18) {
      return new Promise((resolve) => {
        let i = 0;
        function tick() {
          if (i < text.length) {
            el.textContent += text.charAt(i);
            i++;
            messageWrap.scrollTop = messageWrap.scrollHeight;
            // Slightly faster for spaces, slower for punctuation feel
            const ch = text.charAt(i - 1);
            const delay = ch === "." || ch === "," || ch === "!" ? speed * 3 : speed;
            setTimeout(tick, delay);
          } else {
            resolve();
          }
        }
        tick();
      });
    }

    function showScreen(screen) {
      [screenLetter, screenDate, screenFinal].forEach((s) => s.classList.remove("active"));
      screen.classList.add("active");
    }

    function moveNoAway(clientX, clientY) {
      const area = choices.getBoundingClientRect();
      const btnRect = btnNo.getBoundingClientRect();
      const pad = 6;
      const btnW = btnRect.width;
      const btnH = btnRect.height;

      const px = clientX - area.left;
      const py = clientY - area.top;

      const minX = btnW / 2 + pad;
      const maxX = area.width - btnW / 2 - pad;
      const minY = btnH / 2 + pad;
      const maxY = area.height - btnH / 2 - pad;

      // Pick a random spot far from the pointer (and from Yes)
      const yesRect = btnYes.getBoundingClientRect();
      const yesCx = yesRect.left + yesRect.width / 2 - area.left;
      const yesCy = yesRect.top + yesRect.height / 2 - area.top;

      let nx = minX;
      let ny = minY;
      let bestScore = -1;

      for (let attempt = 0; attempt < 24; attempt++) {
        const tx = minX + Math.random() * (maxX - minX);
        const ty = minY + Math.random() * (maxY - minY);
        const fromPointer = Math.hypot(tx - px, ty - py);
        const fromYes = Math.hypot(tx - yesCx, ty - yesCy);
        const score = fromPointer * 1.4 + fromYes * 0.6;
        if (fromPointer > 85 && fromYes > 55 && score > bestScore) {
          bestScore = score;
          nx = tx;
          ny = ty;
        }
      }

      // Fallback: farthest corner from pointer
      if (bestScore < 0) {
        const corners = [
          { x: minX, y: minY },
          { x: maxX, y: minY },
          { x: minX, y: maxY },
          { x: maxX, y: maxY },
        ];
        let best = corners[0];
        let bestD = -1;
        for (const c of corners) {
          const d = Math.hypot(c.x - px, c.y - py);
          if (d > bestD) {
            bestD = d;
            best = c;
          }
        }
        nx = best.x;
        ny = best.y;
      }

      btnNo.style.left = nx + "px";
      btnNo.style.top = ny + "px";
    }

    // Desktop: flee on hover / proximity
    choices.addEventListener("mousemove", (e) => {
      const rect = btnNo.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const dist = Math.hypot(e.clientX - cx, e.clientY - cy);
      if (dist < 90) {
        moveNoAway(e.clientX, e.clientY);
      }
    });

    btnNo.addEventListener("mouseenter", (e) => {
      moveNoAway(e.clientX, e.clientY);
    });

    // Mobile: flee on touch near / on No
    btnNo.addEventListener(
      "touchstart",
      (e) => {
        e.preventDefault();
        const t = e.touches[0];
        moveNoAway(t.clientX, t.clientY);
      },
      { passive: false }
    );

    choices.addEventListener(
      "touchstart",
      (e) => {
        const t = e.touches[0];
        const rect = btnNo.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        if (Math.hypot(t.clientX - cx, t.clientY - cy) < 80) {
          e.preventDefault();
          moveNoAway(t.clientX, t.clientY);
        }
      },
      { passive: false }
    );

    // Block any click on No just in case
    btnNo.addEventListener("click", (e) => {
      e.preventDefault();
      e.stopPropagation();
      moveNoAway(e.clientX || window.innerWidth / 2, e.clientY || window.innerHeight / 2);
    });

    btnContinue.addEventListener("click", () => {
      showScreen(screenDate);
    });

    btnYes.addEventListener("click", async () => {
      showScreen(screenFinal);
      finalMsg.textContent = "";
      let i = 0;
      const speed = 28;
      await new Promise((resolve) => {
        function tick() {
          if (i < FINAL.length) {
            finalMsg.textContent += FINAL.charAt(i);
            i++;
            setTimeout(tick, speed);
          } else {
            resolve();
          }
        }
        tick();
      });
    });

    // Boot
    spawnHearts();
    (async () => {
      await typeWriter(LETTER, messageEl, 16);
      cursorEl.classList.add("hidden");
      btnContinue.classList.add("visible");
    })();
  </script>
</body>
</html>
